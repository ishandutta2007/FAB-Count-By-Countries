<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Circuit Line Gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Light Pulse -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .accent-text {
      fill: #38bdf8;
    }
    .chip-bg {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 2;
    }
    .circuit-path {
      stroke: url(#circuitGrad);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 6 4;
    }
    .pulse-line {
      stroke: #06b6d4;
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 100 400;
      animation: movePulse 4s linear infinite;
    }
    @keyframes movePulse {
      0% { stroke-dashoffset: 500; }
      100% { stroke-dashoffset: -500; }
    }
    .glowing-node {
      animation: nodePulse 2s ease-in-out infinite alternate;
    }
    @keyframes nodePulse {
      0% { r: 4px; opacity: 0.6; }
      100% { r: 7px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGradient)" stroke="#334155" stroke-width="2"/>

  <!-- Dynamic Silicon Circuit Patterns (Background Layer) -->
  <g opacity="0.6">
    <!-- Horizontal & Vertical Grid Lines -->
    <path class="circuit-path" d="M 50,50 L 300,50 L 350,100 L 1150,100" />
    <path class="circuit-path" d="M 100,250 L 400,250 L 450,200 L 1100,200" />
    <path class="circuit-path" d="M 900,20 L 900,120 L 950,170 L 950,280" />
    <path class="circuit-path" d="M 150,10 L 150,180 L 200,230 L 200,290" />

    <!-- Animated Circuit Pulse Lines -->
    <path class="pulse-line" d="M 50,50 L 300,50 L 350,100 L 1150,100" />
    <path class="pulse-line" d="M 100,250 L 400,250 L 450,200 L 1100,200" />
  </g>

  <!-- Decorative Silicon Wafer Nodes (Background Decorative Element) -->
  <g transform="translate(1000, 150)" opacity="0.25">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#c084fc" stroke-width="1"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Glowing Connection Nodes -->
  <circle class="glowing-node" cx="350" cy="100" r="5" fill="#38bdf8" />
  <circle class="glowing-node" cx="450" cy="200" r="5" fill="#818cf8" />
  <circle class="glowing-node" cx="950" cy="170" r="5" fill="#c084fc" />

  <!-- FOREGROUND CONTENT (Ensured clear visibility over dynamic elements) -->
  <g transform="translate(80, 110)">
    <!-- Main Title -->
    <text x="0" y="30" class="title">
      Global <tspan class="accent-text">Semiconductor Fab</tspan> Intelligence
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="75" class="subtitle">
      Country-by-Country Operational Fabs, ASML Lithography (EUV/DUV) &amp; Domestic Foundry Analysis
    </text>
  </g>

  <!-- Top Decorative Tag -->
  <g transform="translate(80, 60)">
    <rect width="190" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="12" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1">
      ⚡ DATASET &amp; INSIGHTS
    </text>
  </g>
</svg>
